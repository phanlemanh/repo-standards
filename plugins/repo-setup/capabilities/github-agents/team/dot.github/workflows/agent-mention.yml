name: Agent — @claude

# Ask the agent anything on an issue or pull request by writing "@claude ..." in a comment
# (only people with write access can trigger it).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >-
      contains(github.event.comment.body || '', '@claude') ||
      contains(github.event.review.body || '', '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(make:*),Bash(npm:*),Bash(npx:*),Bash(uv:*),Bash(python3:*),Bash(git:*),Bash(gh issue:*),Bash(gh pr:*)"
