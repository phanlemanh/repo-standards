name: Release

# release-please turns Conventional Commits on main into a release PR (version + CHANGELOG).
# Merging that PR (a human decision) creates the release, which starts the deploy pipeline:
# staging automatically, production after a human approves the environment.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      # A release needs a key of its own: GitHub Actions may not open pull requests with its own
      # token, and the same switch would let it approve them. Store a PAT or GitHub App token as
      # RELEASE_PLEASE_TOKEN (it also lets CI run on the release PR). Without it this job says so
      # and ends green: a red run after every merge teaches people to ignore red.
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Say that releases are off
        if: env.HAS_RELEASE_TOKEN != 'true'
        run: |
          echo "::notice::Releases are off: add the RELEASE_PLEASE_TOKEN secret."
          echo "Releases are off: add the RELEASE_PLEASE_TOKEN secret (a PAT or GitHub App token that may open pull requests)." >> "$GITHUB_STEP_SUMMARY"
      - id: release
        if: env.HAS_RELEASE_TOKEN == 'true'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
