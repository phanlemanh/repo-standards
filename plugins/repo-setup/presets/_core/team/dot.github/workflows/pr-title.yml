name: PR title

# What reaches the default branch must follow Conventional Commits (feat: ..., fix(scope): ...):
# automated releases read it. Which text reaches it depends on how the repository merges:
#   squash                -> the pull request title becomes the commit: conventional-title
#   merge commit, rebase  -> every commit of the branch lands as it is: conventional-commits
# Each job reads the repository's merge settings and, when it does not apply, passes and says why.
# Both run from the base branch and read the pull request as data: none of its code runs here.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Does this repository squash?
        id: how
        env:
          GH_TOKEN: ${{ github.token }}
        # Unknown counts as yes: the title is checked unless squashing is known to be off.
        run: |
          squash=$(gh repo view "$GITHUB_REPOSITORY" --json squashMergeAllowed --jq .squashMergeAllowed 2>/dev/null || true)
          echo "squash=$squash" >> "$GITHUB_OUTPUT"
          if [ "$squash" = "false" ]; then
            echo "Squash merging is off: the title is not a commit on the default branch. See conventional-commits." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: amannn/action-semantic-pull-request@v6
        if: steps.how.outputs.squash != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The base branch: the hook that judges the commits comes from it, not from the pull request.
      # The hooks run in this checkout, so no token of the repository is left in it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check every commit the branch would add
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Runs only when the branch's own commits are known to reach the default branch.
        run: |
          keeps=$(gh repo view "$GITHUB_REPOSITORY" --json mergeCommitAllowed,rebaseMergeAllowed \
            --jq '.mergeCommitAllowed or .rebaseMergeAllowed' 2>/dev/null || true)
          case "$keeps" in
            true) ;;
            false)
              echo "This repository squashes: the branch's commits do not reach the default branch as they are. Nothing to check here." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            *)
              echo "::warning::The merge settings could not be read: the commits of this branch were not checked."
              exit 0 ;;
          esac
          # The commits are judged by this repository's own commit-msg hooks, whatever their id and
          # however the config names their stage: the same hooks `git commit` runs.
          # judge <file> says what they answer: 0 accepted, 1 refused, 2 pre-commit could not run
          # (no config, a config it cannot read, a hook repository it cannot fetch). pre-commit ends
          # with 1 when a hook refuses and with 3 on an error of its own; its error with exit 1
          # (no config, a config it cannot read) is known by its own line, "An error has occurred:
          # <kind>:". Hooks print the commit message back, so only that whole line counts, from the
          # start of a line: the same words inside a message are not an error of pre-commit.
          own_error='^An (unexpected )?error has occurred: [A-Za-z_.]+:'
          judge() {
            code=0
            pipx run pre-commit run --hook-stage commit-msg --commit-msg-filename "$1" > "$RUNNER_TEMP/hook-out" 2>&1 || code=$?
            if [ "$code" -gt 1 ] || grep -Eq "$own_error" "$RUNNER_TEMP/hook-out"; then
              return 2
            fi
            return "$code"
          }
          # What a hook printed is shown as text only. It may hold the commit message, which the
          # author of the pull request wrote, and this job runs from the base branch: a line of it
          # that starts with `::` must not reach the runner as a workflow command. The runner
          # reads no command until the token comes back, and the token is new on every call.
          # Without a token there is no fence: then nothing of it is shown, and the job is red.
          show_hook_output() {
            fence=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n') || fence=
            if [ "${#fence}" -ne 32 ]; then
              echo "::error::What the commit-msg hooks printed could not be shown safely (no random token on this runner). Run the hooks on the commits locally to read it."
              exit 1
            fi
            echo "::stop-commands::$fence"
            cat "$RUNNER_TEMP/hook-out"
            printf '\n::%s::\n' "$fence"
          }
          # Text the job quotes in its own lines: no control character (a carriage return would
          # start a line of its own), and `%` escaped, as the runner asks for a command's text.
          quoted() { tr -d '\000-\037' | sed 's/%/%25/g'; }
          # An error of pre-commit is not a refusal: the commits are not blamed for it.
          could_not_run() {
            show_hook_output
            echo "::error::pre-commit could not run in this repository, so the commits were not judged: $(grep -E -A1 "$own_error" "$RUNNER_TEMP/hook-out" | tr '\n' ' ' | quoted)"
            exit 1
          }
          # First, do the hooks judge anything? Two messages no rule should accept, one a single
          # dot and one a line of 300 dots: a hook that judges the format or the length refuses at
          # least one. If both pass, this check would be green and judge nothing.
          printf '.\n' > "$RUNNER_TEMP/probe-short"
          printf '%0300d\n' 0 | tr 0 . > "$RUNNER_TEMP/probe-long"
          refused=0
          for probe in probe-short probe-long; do
            answer=0; judge "$RUNNER_TEMP/$probe" || answer=$?
            case "$answer" in
              0) ;;
              1) refused=1; break ;;
              *) could_not_run ;;
            esac
          done
          if [ "$refused" = 0 ]; then
            echo "::error::No hook of this repository refuses a message at commit-msg (see .pre-commit-config.yaml): nothing judges the commits of this branch."
            exit 1
          fi
          # Merge commits (two parents) carry Git's own message.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[] | select((.parents | length) < 2) | .sha' > "$RUNNER_TEMP/shas"
          failed=0
          while read -r sha; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq .commit.message > "$RUNNER_TEMP/message"
            answer=0; judge "$RUNNER_TEMP/message" || answer=$?
            case "$answer" in
              0) ;;
              1) show_hook_output
                 echo "::error::Commit $sha does not pass this repository's commit-msg hooks: $(head -1 "$RUNNER_TEMP/message" | quoted)"; failed=1 ;;
              *) could_not_run ;;
            esac
          done < "$RUNNER_TEMP/shas"
          exit "$failed"
