# Relations between entities.
# from / to must be names of files in ontology/entities/.
# cardinality: one-to-one | one-to-many | many-to-many
relations: []
# Example:
#  - from: Customer
#    name: places
#    to: Order
#    cardinality: one-to-many
#    description: A customer places zero or more orders.
#    lifecycle: { via: Order } # set when the order is created, gone with it, never moved
#
# Once ontology/actions.yaml exists, each relation answers attach, detach and reassign: an action
# that names it (relations: { keeps: [attach] }), or a choice recorded here. `own: true` marks the
# relation that says what "own" means for actions a role runs only on its own records.
#  - from: Staff
#    name: keeps
#    to: Customer
#    cardinality: one-to-many
