# Copy this file to <EntityName>.yaml (e.g. Customer.yaml) and fill it in.
name: Customer
description: A person who has bought at least once.

properties:
  id: { type: string, required: true, unique: true }
  name: { type: string, required: true }
  phone: { type: string, unique: true }
  points: { type: integer, min: 0, default: 0 }

subtypes:
  VIPCustomer:
    description: Customer with at least 100 points.
    rule: "points >= 100"

rules:
  - id: earn-points
    description: 1 point per 10,000 VND of a completed order.
    implemented_in: src/ # path to the single place this rule lives

# Once ontology/actions.yaml exists, each entity needs a create, query, update and delete action.
# Record here only what the actions do not cover:
# lifecycle:
#   update: { later: "Roadmap row 12" } # planned, not built yet
#   delete: { never: "Kept for the accounts", decided_by: "Lan, 2026-01-05" } # a person decided
# or, for a part that lives and dies with its parent:
# lifecycle: { via: Order }

code:
  model: src/ # where the type/model is defined
  tests: tests/
wiki: wiki/entities/customer.md
