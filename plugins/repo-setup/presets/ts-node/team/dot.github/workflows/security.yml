name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Every commit of this branch. The plain `gitleaks` hook reads staged changes only,
      # and nothing is staged here: it would pass whatever the commits hold.
      - run: pipx run pre-commit run gitleaks-history --hook-stage manual --all-files

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Runtime dependencies must be clean; dev tooling is kept fresh by Dependabot.
      - run: npm audit --omit=dev --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # CodeQL reads its own run; a private repository does not allow that by default.
      actions: read
    steps:
      # Code scanning needs GitHub Advanced Security on a private repository. Without it CodeQL
      # can only fail, and a check that is red whatever the code says teaches people to ignore
      # red. Only a clear "not enabled" from GitHub turns it off: any other answer runs CodeQL.
      - name: Is code scanning on here?
        id: scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          answer=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?per_page=1" 2>&1 || true)
          case "$answer" in
            *"Code scanning is not enabled"* | *"Advanced Security must be enabled"*)
              echo "on=false" >> "$GITHUB_OUTPUT"
              echo "::notice::CodeQL is off: code scanning is not enabled for this repository."
              echo "CodeQL is off: code scanning is not enabled for this repository (a private repository needs GitHub Advanced Security)." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "on=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v7
        if: steps.scanning.outputs.on != 'false'
      - uses: github/codeql-action/init@v4
        if: steps.scanning.outputs.on != 'false'
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        if: steps.scanning.outputs.on != 'false'
